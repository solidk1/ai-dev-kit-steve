# Databricks Apps configuration for Builder App
# Copy this file to app.yaml and customize for your deployment
#
# Prerequisites:
#   1. Create the app: databricks apps create <your-app-name>
#   2. Add Lakebase as a resource (see instructions below)
#   3. Configure your LLM provider settings

command:
  - "uvicorn"
  - "server.app:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "$DATABRICKS_APP_PORT"
  - "--log-level"
  - "info"
  - "--access-log"

env:
  # =============================================================================
  # Application Settings
  # =============================================================================
  - name: ENV
    value: "production"
  - name: PROJECTS_BASE_DIR
    value: "./projects"
  - name: PYTHONPATH
    value: "/app/python/source_code:/app/python/source_code/packages"
  
  # =============================================================================
  # Skills Configuration
  # =============================================================================
  # Comma-separated list of skills to enable
  - name: ENABLED_SKILLS
    value: "databricks-bundles,databricks-agent-bricks,databricks-aibi-dashboards,databricks-apps-python,databricks-config,databricks-docs,databricks-jobs,databricks-python-sdk,databricks-unity-catalog,databricks-mlflow-evaluation,databricks-spark-declarative-pipelines,databricks-synthetic-data-gen,databricks-unstructured-pdf-generation"
  - name: SKILLS_ONLY_MODE
    value: "false"
  
  # =============================================================================
  # Database Configuration (Lakebase)
  # =============================================================================
  # Autoscaling only:
  # - Configure a Database resource for this app in the Databricks Apps UI.
  # - The deployment script validates LAKEBASE_ENDPOINT and the app resource.
  # - Databricks auto-injects PGHOST, PGUSER, PGDATABASE, PGPORT.
  - name: LAKEBASE_ENDPOINT
    value: "projects/builder-app-steve/branches/production/endpoints/primary"
  - name: LAKEBASE_DATABASE_NAME
    value: "databricks_postgres"
  - name: LAKEBASE_SCHEMA_NAME
    value: "builder_app"

  
  # =============================================================================
  # Claude SDK Configuration (Databricks AI Gateway)
  # =============================================================================
  # These configure the Claude Agent SDK to use Databricks Anthropic-compatible
  # routing instead of hitting Anthropic directly. For this workspace we pin
  # the AI Gateway base URL explicitly.
  # Auto-derived from DATABRICKS_HOST when unset.
  - name: ANTHROPIC_MODEL
    value: "system.ai.claude-sonnet-5"
  - name: ANTHROPIC_MODEL_MINI
    value: "system.ai.claude-haiku-4-5"
  # Used when the app must call Claude with its own service principal instead of
  # a forwarded user token or saved PAT.
  - name: ANTHROPIC_APP_AUTH_MODEL
    value: "system.ai.claude-haiku-4-5"
  - name: CLAUDE_CODE_STREAM_CLOSE_TIMEOUT
    value: "3600000"

  # =============================================================================
  # MLflow Tracing Configuration
  # =============================================================================
  # Enable MLflow tracing for Claude Code conversations
  # Traces are automatically sent to your Databricks workspace
  # See: https://docs.databricks.com/aws/en/mlflow3/genai/tracing/integrations/claude-code
  - name: MLFLOW_CLAUDE_TRACING_ENABLED
    value: "true"
  - name: MLFLOW_TRACKING_URI
    value: "databricks"
  - name: MLFLOW_REGISTRY_URI
    value: "databricks-uc"
  # Optional: Default MLflow experiment for traces (can be overridden per-session in the UI)
  - name: MLFLOW_EXPERIMENT_NAME
    value: ""  # Set to your MLflow experiment path, e.g. "/Users/your.email@databricks.com/claude-code-traces"

  # =============================================================================
  # Permission Configuration
  # =============================================================================
  # Grant created resources to this principal (e.g., "account users" for all)
  - name: AUTO_GRANT_PERMISSIONS_TO
    value: "account users"
